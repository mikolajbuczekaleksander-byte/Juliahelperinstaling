name: Instaling Helper

on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * *"

permissions:
  contents: write

concurrency:
  group: instaling-helper
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Skonfiguruj Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zainstaluj Playwright i Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Uruchom przeglądarkę i agenta
        env:
          INSTALING_LOGIN: ${{ secrets.INSTALING_LOGIN }}
          INSTALING_PASSWORD: ${{ secrets.INSTALING_PASSWORD }}
        run: |
          python instaling_browser.py
          python main.py

      - name: Zapisz nagrania i zrzuty ekranu
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instaling-observation
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: Zapisz pamięć i słownik
        if: success()
        run: |
          mkdir -p data

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A data/

          if git diff --cached --quiet; then
            echo "Brak nowych danych do zapisania."
          else
            git commit -m "Aktualizacja pamięci i słownika"
            git push origin HEAD:main
          fi
