name: Instaling Helper

on:
  workflow_dispatch:

  schedule:
    - cron: "0 8 * * *"
    - cron: "0 9 * * *"

permissions:
  contents: write

concurrency:
  group: instaling-helper
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Sprawdź godzinę w Polsce
        id: time
        run: |
          HOUR=$(TZ=Europe/Warsaw date +%H)
          echo "hour=$HOUR" >> "$GITHUB_OUTPUT"

      - name: Pomiń uruchomienie poza 10:00
        if: github.event_name == 'schedule' && steps.time.outputs.hour != '10'
        run: |
          echo "To nie jest 10:00 czasu polskiego. Pomijam uruchomienie."

      - name: Pobierz kod
        if: github.event_name == 'workflow_dispatch' || steps.time.outputs.hour == '10'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Skonfiguruj Pythona
        if: github.event_name == 'workflow_dispatch' || steps.time.outputs.hour == '10'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zainstaluj Playwright i Chromium
        if: github.event_name == 'workflow_dispatch' || steps.time.outputs.hour == '10'
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Uruchom agenta InstaLing
        if: github.event_name == 'workflow_dispatch' || steps.time.outputs.hour == '10'
        env:
          INSTALING_LOGIN: ${{ secrets.INSTALING_LOGIN }}
          INSTALING_PASSWORD: ${{ secrets.INSTALING_PASSWORD }}
          PYTHONUNBUFFERED: "1"
        run: |
          python instaling_browser.py

      - name: Zapisz nagrania i diagnostykę
        if: always() && (github.event_name == 'workflow_dispatch' || steps.time.outputs.hour == '10')
        uses: actions/upload-artifact@v4
        with:
          name: instaling-observation-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: Zapisz pamięć i słownik
        if: success() && (github.event_name == 'workflow_dispatch' || steps.time.outputs.hour == '10')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A data/ dictionary.json

          if git diff --cached --quiet; then
            echo "Brak nowych danych do zapisania."
          else
            git commit -m "Aktualizacja pamięci i słownika"
            git push origin HEAD:main
          fi
