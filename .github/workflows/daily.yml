name: Instaling Helper

on:
  workflow_dispatch:
  schedule:
    - cron: "0 16 * * *"

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Skonfiguruj Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Uruchom program
        run: python main.py
