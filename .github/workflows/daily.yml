```yaml
name: Instaling Helper

on:
  workflow_dispatch:

  schedule:
    # 10:00 czasu polskiego w okresie zimowym (UTC+1)
    - cron: "0 9 * * *"

    # 10:00 czasu polskiego w okresie letnim (UTC+2)
    - cron: "0 8 * * *"

permissions:
  contents: write

concurrency:
  group: instaling-helper
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Skonfiguruj Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Zainstaluj Playwright i Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Uruchom agenta InstaLing
        env:
          INSTALING_LOGIN: ${{ secrets.INSTALING_LOGIN }}
          INSTALING_PASSWORD: ${{ secrets.INSTALING_PASSWORD }}
          PYTHONUNBUFFERED: "1"
        run: |
          python instaling_browser.py

      - name: Zapisz nagrania i diagnostykę
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instaling-observation-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7

      - name: Zapisz pamięć i słownik
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A data/ dictionary.json

          if git diff --cached --quiet; then
            echo "Brak nowych danych do zapisania."
          else
            git commit -m "Aktualizacja pamięci i słownika"
            git push origin HEAD:main
          fi
```
